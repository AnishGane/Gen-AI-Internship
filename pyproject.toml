[project]
name = "gen-ai-internship-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.4",
    "langchain-openrouter>=0.2.9",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.14.17",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "truststore>=0.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Week2", "Week5", "Week6", "Week7", "Week8"] # for other weeks just add in this list
