[project]
name = "gen-ai-internship-repo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.19.0",
    "requests>=2.34.2",
    "truststore>=0.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Week2", "Week5", "Week6", "Week7"] # for other weeks just add in this list
